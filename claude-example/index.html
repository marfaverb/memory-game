<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Порцелянові торти — Memory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg id="glass" aria-hidden="true" viewBox="0 0 1000 800" preserveAspectRatio="xMidYMid slice"></svg>

<main>
  <h1>Порцелянові торти</h1>
  <p class="sub">Знайди пари однакових розрізів. Кожна пара — новий смак у твоїй колекції.</p>

  <div class="hud" aria-live="polite">
    <div><b id="hLevel">1</b><span>Рівень</span></div>
    <div><b id="hScore">0</b><span>Бали</span></div>
    <div><b id="hMoves">0</b><span id="hMovesLabel">Ходи</span></div>
    <div><b id="hRank">—</b><span>Звання</span></div>
  </div>

  <div class="board" id="board" role="group" aria-label="Ігрове поле"></div>

  <div class="controls">
    <button class="btn" id="bRestart">Почати рівень знову</button>
    <button class="btn" id="bBacks">Картки: візерунок</button>
  </div>

  <section class="shelf" aria-label="Колекція тортів">
    <h2>Колекція</h2>
    <p id="shelfCount">0 з 12 смаків</p>
    <div class="slots" id="slots"></div>
  </section>
</main>

<div id="overlay" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modal">
    <h3 id="mTitle"></h3>
    <p id="mText"></p>
    <div class="chips" id="mChips"></div>
    <button class="btn primary" id="mBtn"></button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
